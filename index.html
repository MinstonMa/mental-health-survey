<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈尔滨市高中生心理健康现状调研问卷</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e8f0fe;
    color: #333;
    line-height: 1.6;
    padding: 20px;
  }
  .container { max-width: 800px; margin: 0 auto; }
  .header {
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: #fff;
    padding: 32px 28px;
    border-radius: 12px 12px 0 0;
    text-align: center;
  }
  .header h1 { font-size: 22px; margin-bottom: 8px; letter-spacing: 1px; }
  .header p { font-size: 14px; opacity: 0.9; line-height: 1.8; }
  .progress-bar-wrap {
    background: #fff;
    padding: 16px 28px;
    border-bottom: 1px solid #e0e0e0;
  }
  .progress-info {
    display: flex; justify-content: space-between;
    font-size: 13px; color: #666; margin-bottom: 6px;
  }
  .progress-track {
    height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: #1a73e8; border-radius: 3px;
    transition: width 0.4s ease; width: 0%;
  }
  .module-nav {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 14px 28px; background: #f5f8ff;
    border-bottom: 1px solid #e0e0e0;
  }
  .module-btn {
    padding: 6px 14px; border-radius: 14px; border: 1px solid #c4d7f5;
    background: #fff; color: #1a73e8; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
  }
  .module-btn:hover { background: #e8f0fe; }
  .module-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .module-section { display: none; }
  .module-section.active { display: block; }
  .question-card {
    background: #fff; padding: 24px 28px;
    border-bottom: 1px solid #f0f0f0;
  }
  .q-title {
    font-size: 15px; font-weight: 600; margin-bottom: 12px;
  }
  .q-title .required { color: #d32f2f; margin-left: 2px; }
  .q-type-badge {
    display: inline-block; font-size: 11px; padding: 1px 8px;
    border-radius: 10px; background: #e8f0fe; color: #1a73e8;
    margin-left: 8px; font-weight: 400; vertical-align: middle;
  }
  .options { padding-left: 4px; }
  .option-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 6px;
    cursor: pointer; transition: background 0.15s;
    margin-bottom: 2px;
  }
  .option-item:hover { background: #f5f8ff; }
  .option-item input[type="radio"],
  .option-item input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: #1a73e8; cursor: pointer;
    flex-shrink: 0;
  }
  .option-item label { cursor: pointer; font-size: 14px; flex: 1; }
  .rating-row {
    display: flex; gap: 0; margin: 8px 0;
    flex-wrap: wrap;
  }
  .rating-item {
    text-align: center; flex: 1; min-width: 50px;
  }
  .rating-item input { display: none; }
  .rating-item label {
    display: block; padding: 10px 0 6px;
    background: #f5f8ff; border: 1px solid #dde8f5;
    cursor: pointer; font-size: 18px; font-weight: 700; color: #555;
    transition: all 0.15s;
    margin: 0 -0.5px;
  }
  .rating-item label:hover { background: #dde8f5; }
  .rating-item input:checked + label {
    background: #1a73e8; color: #fff; border-color: #1a73e8;
    position: relative; z-index: 1;
  }
  .rating-item:first-child label { border-radius: 6px 0 0 6px; }
  .rating-item:last-child label { border-radius: 0 6px 6px 0; }
  .rating-labels {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #888; margin-top: 2px;
  }
  .textarea-wrap textarea {
    width: 100%; min-height: 90px; padding: 12px;
    border: 1px solid #d0d0d0; border-radius: 6px;
    font-size: 14px; font-family: inherit;
    resize: vertical; transition: border-color 0.2s;
  }
  .textarea-wrap textarea:focus {
    outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
  }
  .footer-nav {
    background: #fff; padding: 18px 28px;
    display: flex; justify-content: space-between;
    border-radius: 0 0 12px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    position: sticky; bottom: 0;
  }
  .footer-nav button {
    padding: 10px 32px; border-radius: 6px; font-size: 15px;
    border: none; cursor: pointer; transition: all 0.2s;
  }
  .btn-prev { background: #f0f0f0; color: #555; }
  .btn-prev:hover { background: #e0e0e0; }
  .btn-prev:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-next { background: #1a73e8; color: #fff; }
  .btn-next:hover { background: #1557b0; }
  .btn-submit { background: #43a047; color: #fff; }
  .btn-submit:hover { background: #388e3c; }
  .error-msg {
    color: #d32f2f; font-size: 13px; margin-top: 6px;
    display: none;
  }
  .result-page {
    background: #fff; border-radius: 0 0 12px 12px;
    padding: 40px 28px; display: none; text-align: center;
  }
  .result-page h2 { font-size: 24px; margin-bottom: 12px; color: #1a73e8; }
  .result-page p { font-size: 14px; color: #666; margin-bottom: 20px; }
  .share-section {
    background: #f5f8ff; border-radius: 8px; padding: 24px;
    margin: 20px 0; text-align: center;
  }
  .share-section h3 { font-size: 16px; color: #333; margin-bottom: 12px; }
  .share-url-box {
    background: #fff; border: 1px solid #d0d0d0; border-radius: 6px;
    padding: 12px 16px; font-size: 14px; color: #1a73e8;
    word-break: break-all; margin-bottom: 12px;
  }
  .btn-copy {
    padding: 8px 24px; background: #1a73e8; color: #fff;
    border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  .btn-copy:hover { background: #1557b0; }
  .result-summary {
    background: #f5f8ff; border-radius: 8px; padding: 20px;
    margin: 20px 0; text-align: left;
  }
  .result-summary table {
    width: 100%; border-collapse: collapse; font-size: 14px;
  }
  .result-summary th, .result-summary td {
    text-align: left; padding: 8px 12px;
    border-bottom: 1px solid #e0e0e0;
  }
  .result-summary th { color: #555; font-weight: 500; }
  .btn-export {
    display: inline-block; padding: 10px 28px;
    background: #1a73e8; color: #fff; border-radius: 6px;
    border: none; font-size: 15px; cursor: pointer;
    margin-top: 16px; text-decoration: none;
  }
  .btn-export:hover { background: #1557b0; }
  @media (max-width: 600px) {
    body { padding: 10px; }
    .header h1 { font-size: 18px; }
    .rating-item { min-width: 36px; }
    .rating-item label { font-size: 15px; padding: 8px 0 4px; }
    .footer-nav button { padding: 8px 20px; font-size: 14px; }
    .module-nav { padding: 10px 16px; }
    .question-card { padding: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>哈尔滨市高中生心理健康现状调研问卷</h1>
    <p>本问卷旨在了解哈尔滨市高中生的心理健康现状，为学校和社会提供更有针对性的心理支持服务。<br>问卷匿名填写，数据仅用于调研分析，请放心如实作答。感谢你的参与！</p>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-info">
      <span id="progressText">已完成：0%</span>
      <span id="progressCount">第 1 题 / 共 33 题</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="module-nav" id="moduleNav"></div>

  <div id="surveyBody"></div>

  <div class="footer-nav" id="footerNav">
    <button class="btn-prev" id="prevBtn" onclick="prevModule()">上一模块</button>
    <button class="btn-next" id="nextBtn" onclick="nextModule()">下一模块</button>
  </div>

  <div class="result-page" id="resultPage">
    <h2>提交成功！</h2>
    <p>感谢你认真完成这份问卷，你的每一份回答都很有价值。</p>

    <div class="share-section">
      <h3>分享给更多同学填写</h3>
      <div class="share-url-box" id="shareUrl">https://minstonma.github.io/mental-health-survey/</div>
      <button class="btn-copy" onclick="copyShareUrl()">复制问卷链接</button>
    </div>

    <div class="result-summary" id="resultSummary"></div>
    <button class="btn-export" onclick="exportCSV()">导出我的回答为 CSV</button>
    <br><br>
    <button class="btn-next" onclick="resetSurvey()" style="padding:8px 24px;font-size:13px;">重新填写</button>
  </div>
</div>

<script>
const surveyData = {
  "title": "哈尔滨市高中生心理健康现状调研问卷",
  "modules": [
    {"name":"基本信息","questions":[
      {"id":1,"text":"你的性别：","type":"单选","options":["男","女"],"required":true},
      {"id":2,"text":"你所在的年级：","type":"单选","options":["高一","高二","高三"],"required":true},
      {"id":3,"text":"你就读的学校类型：","type":"单选","options":["省级重点高中","市级重点高中","普通高中","职业高中"],"required":true},
      {"id":4,"text":"你的生源地属于：","type":"单选","options":["城市","城镇（县城）","农村"],"required":true},
      {"id":5,"text":"你是否为独生子女：","type":"单选","options":["是","否"],"required":true}
    ]},
    {"name":"学业压力与睡眠","questions":[
      {"id":6,"text":"你每天平均学习时长（含上课、自习、课外补习）：","type":"单选","options":["8小时以下","8-10小时","10-12小时","12小时以上"],"required":true},
      {"id":7,"text":"你目前感受到的学业压力程度：","type":"评分","min":1,"max":5,"labels":{"1":"完全没有压力","5":"压力极大"},"required":true},
      {"id":8,"text":"你的学业压力主要来源于哪些方面？（可多选）","type":"多选","options":["考试频繁","作业量大","成绩排名竞争","家长期望过高","自我要求过高","升学/高考压力","对未来迷茫","其他"],"required":true},
      {"id":9,"text":"你每天平均睡眠时长：","type":"单选","options":["不足6小时","6-7小时","7-8小时","8小时以上"],"required":true},
      {"id":10,"text":"你对自己睡眠质量的评价：","type":"评分","min":1,"max":5,"labels":{"1":"很差","5":"很好"},"required":true},
      {"id":11,"text":"你是否因学业压力出现过以下身体不适？（可多选）","type":"多选","options":["头痛/头晕","失眠","食欲不振","胃痛/胃胀","心慌/心悸","脱发","没有出现过","其他"],"required":true}
    ]},
    {"name":"心理支持","questions":[
      {"id":12,"text":"你所在的学校是否设有心理咨询室：","type":"单选","options":["有且正常开放","有但很少开放","没有","不清楚"],"required":true},
      {"id":13,"text":"你是否愿意在需要时使用学校提供的心理咨询服务：","type":"单选","options":["愿意","不愿意","不确定"],"required":true},
      {"id":14,"text":"你不愿意或不确定使用心理咨询服务的原因是什么？（可多选，上题选「愿意」可跳过）","type":"多选","options":["担心被同学或老师知道","觉得咨询没有效果","不知道预约流程和地点","担心隐私泄露","觉得自己问题不严重不需要","收费问题","其他"],"required":false},
      {"id":15,"text":"当你遇到心理困扰时，通常会向谁倾诉？（可多选）","type":"多选","options":["朋友/同学","父亲/母亲","老师/班主任","心理咨询师","网友/线上社群","男/女朋友","不向任何人倾诉","其他"],"required":true},
      {"id":16,"text":"你对学校目前提供的心理健康教育的整体评价：","type":"评分","min":1,"max":5,"labels":{"1":"非常不满意","5":"非常满意"},"required":true},
      {"id":17,"text":"你希望学校开展哪些心理健康相关活动？（可多选）","type":"多选","options":["心理健康必修课程","团体心理辅导活动","一对一心理咨询","心理健康讲座","定期心理测评","减压放松活动（瑜伽/冥想等）","朋辈互助小组","不需要额外活动","其他"],"required":true}
    ]},
    {"name":"家庭因素","questions":[
      {"id":18,"text":"你的家庭结构：","type":"单选","options":["双亲家庭（父母同住）","单亲家庭（父母离异或一方去世）","重组家庭","留守家庭（父母外出务工）","其他"],"required":true},
      {"id":19,"text":"父母对你的学习成绩期望程度：","type":"单选","options":["非常高，要求名列前茅","比较高，希望中上水平","适中，尽力就好","不太关注成绩"],"required":true},
      {"id":20,"text":"父母对你心理健康的关注程度：","type":"评分","min":1,"max":5,"labels":{"1":"完全不关注","5":"非常关注"},"required":true},
      {"id":21,"text":"你和父母（或其他监护人）的沟通频率：","type":"单选","options":["每天都有深入交流","每周交流几次","每周一次左右","很少沟通（每月1-2次）","几乎不沟通"],"required":true},
      {"id":22,"text":"你和父母沟通时主要谈论的话题：（可多选）","type":"多选","options":["学习成绩和考试","日常生活和饮食","未来升学和职业规划","兴趣爱好和娱乐","心理感受和情绪","很少沟通没有固定话题","其他"],"required":true},
      {"id":23,"text":"当你向父母倾诉压力或烦恼时，他们通常的反应是：","type":"单选","options":["耐心倾听并安慰我","帮我分析问题给出建议","批评我说我想太多","不管不问让我自己解决","鼓励我自己面对和解决","我从不向父母倾诉"],"required":true}
    ]},
    {"name":"社交与情绪","questions":[
      {"id":24,"text":"你在学校有多少关系密切、可以交心的朋友：","type":"单选","options":["没有","1-2个","3-5个","5个以上"],"required":true},
      {"id":25,"text":"你在学校里的人际关系总体状况：","type":"评分","min":1,"max":5,"labels":{"1":"非常差","5":"非常好"},"required":true},
      {"id":26,"text":"近一个月内，你经常出现以下哪些情绪？（可多选）","type":"多选","options":["焦虑紧张","抑郁低落","烦躁易怒","孤独寂寞","愤怒不满","无聊空虚","平静放松","愉快开心","其他"],"required":true},
      {"id":27,"text":"你当前主要的心理困扰来源于：（可多选，限选3项）","type":"多选","maxSelections":3,"options":["学业压力","考试焦虑","睡眠不足","自我期望过高","社交与人际关系困扰","亲子沟通困难","对未来的迷茫","外貌/体型焦虑","家庭经济压力","情绪管理困难","其他"],"required":true},
      {"id":28,"text":"你对自己情绪调节和管理能力的评价：","type":"评分","min":1,"max":5,"labels":{"1":"非常差","5":"非常好"},"required":true},
      {"id":29,"text":"你通常采用哪些方式缓解负面情绪？（可多选）","type":"多选","options":["听音乐/唱歌","运动/跑步","打游戏","找朋友倾诉","写日记/画画","吃东西","睡觉","刷手机/看视频","自我消化/憋着","寻求心理咨询帮助","其他"],"required":true},
      {"id":30,"text":"整体而言，你对自己目前心理健康状况的评价：","type":"评分","min":1,"max":5,"labels":{"1":"非常差","5":"非常好"},"required":true}
    ]},
    {"name":"开放性问题","questions":[
      {"id":31,"text":"你希望学校在心理健康方面提供哪些具体的帮助或支持？","type":"文本","required":false},
      {"id":32,"text":"你认为学校目前的心理健康课程或服务中，最需要改进的地方是什么？","type":"文本","required":false},
      {"id":33,"text":"你最想对父母或老师说的一句心里话是什么？（关于心理健康方面）","type":"文本","required":false}
    ]}
  ]
};

let currentModule = 0;
let answers = {};

function qId(q) { return 'q_' + q.id; }

function getTypeBadge(type) {
  const map = {'单选':'单选','多选':'多选','评分':'评分题','文本':'开放题'};
  return map[type] || type;
}

function render() {
  const nav = document.getElementById('moduleNav');
  const body = document.getElementById('surveyBody');
  nav.innerHTML = '';
  body.innerHTML = '';

  surveyData.modules.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'module-btn' + (i === currentModule ? ' active' : '');
    btn.textContent = m.name;
    btn.onclick = () => goToModule(i);
    nav.appendChild(btn);

    const sec = document.createElement('div');
    sec.className = 'module-section' + (i === currentModule ? ' active' : '');
    sec.dataset.module = i;

    m.questions.forEach(q => {
      const card = document.createElement('div');
      card.className = 'question-card';
      const req = q.required ? '<span class="required">*</span>' : '';
      card.innerHTML = '<div class="q-title">' + q.id + '. ' + q.text + req + '<span class="q-type-badge">' + getTypeBadge(q.type) + '</span></div><div class="options" id="opt_' + qId(q) + '"></div><div class="error-msg" id="err_' + qId(q) + '">请回答此题</div>';
      sec.appendChild(card);
    });
    body.appendChild(sec);
  });
  renderQuestions();
  updateProgress();
}

function renderQuestions() {
  surveyData.modules.forEach(m => {
    m.questions.forEach(q => {
      const cont = document.getElementById('opt_' + qId(q));
      if (!cont) return;
      if (q.type === '单选') renderRadio(cont, q);
      else if (q.type === '多选') renderCheckbox(cont, q);
      else if (q.type === '评分') renderRating(cont, q);
      else if (q.type === '文本') renderText(cont, q);
    });
  });
}

function renderRadio(cont, q) {
  q.options.forEach(o => {
    const div = document.createElement('div');
    div.className = 'option-item';
    const id = qId(q) + '_' + o.replace(/\s+/g,'');
    const checked = answers[qId(q)] === o ? ' checked' : '';
    div.innerHTML = '<input type="radio" name="' + qId(q) + '" value="' + o + '" id="' + id + '"' + checked + '><label for="' + id + '">' + o + '</label>';
    div.querySelector('input').addEventListener('change', () => {
      answers[qId(q)] = o;
      document.getElementById('err_' + qId(q)).style.display = 'none';
      updateProgress();
    });
    cont.appendChild(div);
  });
}

function renderCheckbox(cont, q) {
  const maxSel = q.maxSelections || 0;
  q.options.forEach(o => {
    const div = document.createElement('div');
    div.className = 'option-item';
    const id = qId(q) + '_' + o.replace(/\s+/g,'');
    const arr = answers[qId(q)] || [];
    const checked = arr.includes(o) ? ' checked' : '';
    div.innerHTML = '<input type="checkbox" value="' + o + '" id="' + id + '"' + checked + '><label for="' + id + '">' + o + '</label>';
    const cb = div.querySelector('input');
    cb.addEventListener('change', () => {
      let sel = answers[qId(q)] || [];
      if (cb.checked) {
        if (maxSel > 0 && sel.length >= maxSel) {
          cb.checked = false;
          alert('本题最多选择 ' + maxSel + ' 项');
          return;
        }
        sel.push(o);
      } else {
        sel = sel.filter(v => v !== o);
      }
      answers[qId(q)] = sel;
      document.getElementById('err_' + qId(q)).style.display = 'none';
      updateProgress();
    });
    cont.appendChild(div);
  });
  if (maxSel > 0) {
    const hint = document.createElement('div');
    hint.style.cssText = 'font-size:12px;color:#888;margin-top:4px;';
    hint.textContent = '限选 ' + maxSel + ' 项';
    cont.appendChild(hint);
  }
}

function renderRating(cont, q) {
  const min = q.min, max = q.max;
  const wrap = document.createElement('div');
  wrap.className = 'rating-wrap';
  const row = document.createElement('div');
  row.className = 'rating-row';
  for (let v = min; v <= max; v++) {
    const item = document.createElement('div');
    item.className = 'rating-item';
    const id = qId(q) + '_' + v;
    const checked = answers[qId(q)] === v ? ' checked' : '';
    item.innerHTML = '<input type="radio" name="' + qId(q) + '" value="' + v + '" id="' + id + '"' + checked + '><label for="' + id + '">' + v + '</label>';
    item.querySelector('input').addEventListener('change', () => {
      answers[qId(q)] = v;
      document.getElementById('err_' + qId(q)).style.display = 'none';
      updateProgress();
    });
    row.appendChild(item);
  }
  wrap.appendChild(row);
  if (q.labels) {
    const labels = document.createElement('div');
    labels.className = 'rating-labels';
    const minSpan = document.createElement('span');
    minSpan.textContent = q.labels['1'];
    const midSpan = document.createElement('span');
    midSpan.textContent = q.labels['3'] || '';
    const maxSpan = document.createElement('span');
    maxSpan.textContent = q.labels[max];
    labels.appendChild(minSpan);
    labels.appendChild(midSpan);
    labels.appendChild(maxSpan);
    wrap.appendChild(labels);
  }
  cont.appendChild(wrap);
}

function renderText(cont, q) {
  const wrap = document.createElement('div');
  wrap.className = 'textarea-wrap';
  const val = answers[qId(q)] || '';
  wrap.innerHTML = '<textarea placeholder="请在此输入你的回答..." maxlength="500">' + val + '</textarea>';
  const ta = wrap.querySelector('textarea');
  ta.addEventListener('input', () => {
    answers[qId(q)] = ta.value;
    const err = document.getElementById('err_' + qId(q));
    if (err) err.style.display = 'none';
    updateProgress();
  });
  const count = document.createElement('div');
  count.style.cssText = 'font-size:12px;color:#999;text-align:right;margin-top:4px;';
  count.id = 'cnt_' + qId(q);
  count.textContent = '0 / 500';
  ta.addEventListener('input', () => {
    count.textContent = ta.value.length + ' / 500';
    if (ta.value.length > 500) ta.value = ta.value.slice(0,500);
  });
  wrap.appendChild(count);
  cont.appendChild(wrap);
}

function getAnsweredCount() {
  let count = 0;
  surveyData.modules.forEach(m => {
    m.questions.forEach(q => {
      const val = answers[qId(q)];
      if (q.type === '单选' || q.type === '评分') {
        if (val !== undefined && val !== '') count++;
      } else if (q.type === '多选') {
        if (val && val.length > 0) count++;
      } else if (q.type === '文本') {
        if (val && val.trim().length > 0) count++;
      }
    });
  });
  return count;
}

function totalQuestions() {
  let n = 0;
  surveyData.modules.forEach(m => n += m.questions.length);
  return n;
}

function updateProgress() {
  const total = totalQuestions();
  const done = getAnsweredCount();
  const pct = Math.round(done / total * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = '已完成：' + pct + '%';
  document.getElementById('progressCount').textContent = '已答 ' + done + ' 题 / 共 ' + total + ' 题';
}

function goToModule(i) {
  if (i < 0 || i >= surveyData.modules.length) return;
  currentModule = i;
  document.querySelectorAll('.module-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.module-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.module-section[data-module="' + i + '"]').classList.add('active');
  document.querySelectorAll('.module-btn')[i].classList.add('active');
  document.getElementById('prevBtn').disabled = (i === 0);
  const nextBtn = document.getElementById('nextBtn');
  if (i === surveyData.modules.length - 1) {
    nextBtn.textContent = '提交问卷';
    nextBtn.className = 'btn-submit';
    nextBtn.onclick = submitSurvey;
  } else {
    nextBtn.textContent = '下一模块';
    nextBtn.className = 'btn-next';
    nextBtn.onclick = nextModule;
  }
  document.getElementById('footerNav').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextModule() {
  if (!validateModule(currentModule)) return;
  if (currentModule < surveyData.modules.length - 1) goToModule(currentModule + 1);
}

function prevModule() {
  if (currentModule > 0) goToModule(currentModule - 1);
}

function validateModule(i) {
  let ok = true;
  const m = surveyData.modules[i];
  m.questions.forEach(q => {
    if (!q.required) return;
    const val = answers[qId(q)];
    let filled = false;
    if (q.type === '单选' || q.type === '评分') filled = (val !== undefined && val !== '');
    else if (q.type === '多选') filled = (val && val.length > 0);
    else if (q.type === '文本') filled = (val && val.trim().length > 0);
    if (!filled) {
      document.getElementById('err_' + qId(q)).style.display = 'block';
      ok = false;
    } else {
      document.getElementById('err_' + qId(q)).style.display = 'none';
    }
  });
  return ok;
}

const SUPABASE_URL = 'https://tlsdhlbtauqgczyvwers.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OvcR4xbJVrZ-7Dtnc5O5OA_slhJFlRK';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function submitSurvey() {
  if (!validateModule(currentModule)) return;

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = true;
  nextBtn.textContent = '提交中...';

  try {
    const responseData = {};
    surveyData.modules.forEach(m => {
      m.questions.forEach(q => {
        responseData[q.id] = answers[qId(q)] || (q.type === '多选' ? [] : '');
      });
    });

    const { error } = await supabase.from('responses').insert({ data: responseData });
    if (error) throw error;
  } catch (e) {
    alert('提交失败，请检查网络后重试。\n' + e.message);
    nextBtn.disabled = false;
    nextBtn.textContent = '提交问卷';
    return;
  }

  document.getElementById('surveyBody').style.display = 'none';
  document.getElementById('moduleNav').style.display = 'none';
  document.getElementById('footerNav').style.display = 'none';
  document.getElementById('resultPage').style.display = 'block';
  document.querySelector('.progress-bar-wrap').style.display = 'none';

  const summary = document.getElementById('resultSummary');
  let html = '<table><tr><th>模块</th><th>完成题数</th><th>总题数</th></tr>';
  let totalDone = 0, totalAll = 0;
  surveyData.modules.forEach(m => {
    let done = 0, all = m.questions.length;
    m.questions.forEach(q => {
      const val = answers[qId(q)];
      if (q.type === '单选' || q.type === '评分') { if (val !== undefined) done++; }
      else if (q.type === '多选') { if (val && val.length > 0) done++; }
      else if (q.type === '文本') { if (val && val.trim()) done++; }
    });
    totalDone += done; totalAll += all;
    html += '<tr><td>' + m.name + '</td><td>' + done + '</td><td>' + all + '</td></tr>';
  });
  html += '<tr style="font-weight:600"><td>合计</td><td>' + totalDone + '</td><td>' + totalAll + '</td></tr></table>';
  summary.innerHTML = html;
}

function exportCSV() {
  const BOM = '﻿';
  let csv = BOM + '题号,题目,模块,题型,回答\n';
  surveyData.modules.forEach(m => {
    m.questions.forEach(q => {
      const val = answers[qId(q)];
      let display = '';
      if (Array.isArray(val)) display = val.join('; ');
      else if (val !== undefined && val !== null) display = String(val);
      else display = '';
      csv += q.id + ',"' + q.text + '","' + m.name + '","' + getTypeBadge(q.type) + '","' + display.replace(/"/g,'""') + '"\n';
    });
  });
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '心理健康问卷回答.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function copyShareUrl() {
  const url = document.getElementById('shareUrl').textContent;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '已复制！';
    setTimeout(() => { btn.textContent = '复制问卷链接'; }, 2000);
  });
}

function resetSurvey() {
  answers = {};
  currentModule = 0;
  document.getElementById('surveyBody').style.display = '';
  document.getElementById('moduleNav').style.display = '';
  document.getElementById('footerNav').style.display = '';
  document.getElementById('resultPage').style.display = 'none';
  document.querySelector('.progress-bar-wrap').style.display = '';
  render();
  goToModule(0);
}

render();
goToModule(0);
</script>
