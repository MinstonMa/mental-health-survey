<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问卷数据管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0f2f5; color: #333; line-height: 1.6;
  }
  .login-wrap {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }
  .login-box {
    background: #fff; padding: 40px; border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 360px; text-align: center;
  }
  .login-box h1 { font-size: 20px; margin-bottom: 24px; color: #1a73e8; }
  .login-box input {
    width: 100%; padding: 12px 16px; border: 1px solid #d0d0d0;
    border-radius: 6px; font-size: 15px; margin-bottom: 16px; outline: none;
  }
  .login-box input:focus { border-color: #1a73e8; }
  .login-box button {
    width: 100%; padding: 12px; background: #1a73e8; color: #fff;
    border: none; border-radius: 6px; font-size: 15px; cursor: pointer;
  }
  .login-box button:hover { background: #1557b0; }
  .login-error { color: #d32f2f; font-size: 13px; margin-top: 8px; display: none; }

  .admin-wrap { display: none; }
  .top-bar {
    background: #1a73e8; color: #fff; padding: 16px 28px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .top-bar h1 { font-size: 18px; }
  .top-bar .stats { font-size: 14px; opacity: 0.9; }
  .top-bar button {
    padding: 8px 20px; background: rgba(255,255,255,0.2); color: #fff;
    border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .top-bar button:hover { background: rgba(255,255,255,0.3); }

  .content { max-width: 1400px; margin: 0 auto; padding: 20px; }

  .stat-cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .stat-card {
    background: #fff; border-radius: 8px; padding: 16px; text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .stat-card .num { font-size: 24px; font-weight: 700; color: #1a73e8; }
  .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }

  .chart-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .chart-card {
    background: #fff; border-radius: 8px; padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .chart-card h3 { font-size: 14px; color: #555; margin-bottom: 8px; }
  .chart-card canvas { max-height: 260px; }

  .tab-bar {
    display: flex; gap: 0; margin-bottom: 16px;
    border-bottom: 2px solid #e0e0e0;
  }
  .tab-bar button {
    padding: 10px 24px; background: none; border: none;
    font-size: 14px; cursor: pointer; color: #666;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
  }
  .tab-bar button.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }

  .data-table-wrap {
    background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    overflow-x: auto; display: none; padding: 16px;
  }
  .data-table-wrap.active { display: block; }
  .data-table-wrap table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .data-table-wrap th {
    background: #f5f8ff; text-align: left; padding: 8px 10px; white-space: nowrap;
    border-bottom: 2px solid #e0e0e0; position: sticky; top: 0;
  }
  .data-table-wrap td {
    padding: 6px 10px; border-bottom: 1px solid #f0f0f0;
    max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .data-table-wrap tr:hover td { background: #fafbff; }
  .data-table-wrap .scroll-wrap { max-height: 600px; overflow-y: auto; }

  .individual-wrap { display: none; }
  .individual-wrap.active { display: block; }
  .response-card {
    background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    padding: 16px 20px; margin-bottom: 10px;
  }
  .response-card .q-row {
    display: flex; gap: 10px; padding: 5px 0;
    border-bottom: 1px solid #f5f5f5; font-size: 13px;
  }
  .response-card .q-label { color: #888; min-width: 130px; flex-shrink: 0; }
  .response-card .q-answer { flex: 1; }
  .response-card .q-number { color: #bbb; width: 28px; flex-shrink: 0; }

  .module-filter {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .module-filter button {
    padding: 4px 14px; border-radius: 14px; border: 1px solid #c4d7f5;
    background: #fff; color: #1a73e8; font-size: 12px; cursor: pointer;
  }
  .module-filter button.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }

  .toolbar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;
  }
  .toolbar button {
    padding: 8px 18px; background: #1a73e8; color: #fff;
    border: none; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .toolbar button:hover { background: #1557b0; }
  .toolbar .count { font-size: 14px; color: #666; }
  .empty-state { text-align: center; padding: 60px 20px; color: #999; }
  .loading { text-align: center; padding: 60px; color: #666; }

  @media (max-width: 600px) {
    .chart-grid { grid-template-columns: 1fr; }
    .top-bar { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1>问卷数据管理后台</h1>
    <p style="font-size:13px;color:#888;margin-bottom:20px;">哈尔滨市高中生心理健康现状调研问卷</p>
    <input type="password" id="pwdInput" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter') doLogin()">
    <button onclick="doLogin()">登录</button>
    <div class="login-error" id="loginError">密码错误，请重试</div>
  </div>
</div>

<div class="admin-wrap" id="adminWrap">
  <div class="top-bar">
    <div>
      <h1>问卷数据管理后台</h1>
      <div class="stats">共 <span id="totalCount">0</span> 份回答</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button onclick="exportAllCSV()">导出全部 CSV</button>
      <button onclick="logout()" style="background:rgba(255,255,255,0.1);">退出</button>
    </div>
  </div>

  <div class="content">
    <div class="toolbar">
      <button onclick="refreshData()">刷新数据</button>
      <span class="count" id="responseCount">加载中...</span>
    </div>

    <div class="stat-cards" id="statCards"></div>

    <div class="tab-bar">
      <button class="active" onclick="switchTab('charts',this)">统计图表</button>
      <button onclick="switchTab('table',this)">数据表格</button>
      <button onclick="switchTab('individual',this)">逐份查看</button>
    </div>

    <div id="chartsTab" class="chart-grid"></div>

    <div id="tableTab" class="data-table-wrap">
      <div class="scroll-wrap" id="tableBody"></div>
    </div>

    <div id="individualTab" class="individual-wrap">
      <div class="module-filter" id="indivFilter"></div>
      <div id="individualBody"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tlsdhlbtauqgczyvwers.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OvcR4xbJVrZ-7Dtnc5O5OA_slhJFlRK';
const ADMIN_PASSWORD = 'mh2025hrb';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// New 33-question data
const modules = [
  {name:"基本信息", ids:[1,2,3,4,5]},
  {name:"学业压力与睡眠", ids:[6,7,8,9,10,11]},
  {name:"心理支持", ids:[12,13,14,15,16,17]},
  {name:"家庭因素", ids:[18,19,20,21,22,23]},
  {name:"社交与情绪", ids:[24,25,26,27,28,29,30]},
  {name:"开放性问题", ids:[31,32,33]}
];

const questions = {
  1:'性别', 2:'年级', 3:'学校类型', 4:'生源地', 5:'独生子女',
  6:'每日学习时长', 7:'学业压力(1-5)', 8:'压力来源', 9:'睡眠时长', 10:'睡眠质量(1-5)', 11:'身体不适',
  12:'学校心理咨询室', 13:'咨询意愿', 14:'不愿咨询原因', 15:'倾诉对象', 16:'心育评价(1-5)', 17:'期望活动',
  18:'家庭结构', 19:'家长期望', 20:'父母关注(1-5)', 21:'沟通频率', 22:'沟通话题', 23:'父母反应',
  24:'知心朋友', 25:'人际关系(1-5)', 26:'近期情绪', 27:'困扰来源', 28:'情绪调节(1-5)', 29:'缓解方式', 30:'整体心理(1-5)',
  31:'期望帮助', 32:'改进建议', 33:'心里话'
};

const singleChoice = [1,2,3,4,5,6,9,12,13,18,19,21,23,24];
const multiChoice = [8,11,14,15,17,22,26,27,29];
const scaleQs = [7,10,16,20,25,28,30];
const textQs = [31,32,33];

let allData = [];
let chartInstances = [];

function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  if (pwd === ADMIN_PASSWORD) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('adminWrap').style.display = 'block';
    refreshData();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function logout() {
  document.getElementById('adminWrap').style.display = 'none';
  document.getElementById('loginWrap').style.display = '';
  document.getElementById('pwdInput').value = '';
  document.getElementById('loginError').style.display = 'none';
}

async function refreshData() {
  document.getElementById('responseCount').textContent = '加载中...';
  document.getElementById('chartsTab').innerHTML = '<div class="loading">加载中...</div>';
  try {
    const { data, error } = await supabase.from('responses').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    allData = data || [];
    document.getElementById('totalCount').textContent = allData.length;
    document.getElementById('responseCount').textContent = '共 ' + allData.length + ' 份回答';
    renderStatCards();
    renderCharts();
    renderTable();
    renderIndividual();
  } catch (e) {
    document.getElementById('responseCount').textContent = '加载失败: ' + e.message;
    document.getElementById('chartsTab').innerHTML = '<div class="empty-state"><h2>加载失败</h2><p>' + e.message + '</p></div>';
  }
}

function getVal(d, qid) {
  const v = d.data && d.data[qid];
  return (v !== undefined && v !== null && v !== '') ? v : null;
}

function countValues(qid) {
  const counts = {};
  let total = 0;
  allData.forEach(d => {
    const v = getVal(d, qid);
    if (v === null) return;
    total++;
    if (Array.isArray(v)) {
      v.forEach(item => { counts[item] = (counts[item] || 0) + 1; });
    } else {
      counts[String(v)] = (counts[String(v)] || 0) + 1;
    }
  });
  return { counts, total };
}

function calcAvgScale(qid) {
  let sum = 0, n = 0;
  allData.forEach(d => {
    const v = getVal(d, qid);
    if (v !== null) { const num = Number(v); if (!isNaN(num)) { sum += num; n++; } }
  });
  return n > 0 ? (sum / n).toFixed(1) : '-';
}

function pct(numerator, denominator) {
  return denominator > 0 ? Math.round(numerator / denominator * 100) : 0;
}

function renderStatCards() {
  const container = document.getElementById('statCards');
  if (allData.length === 0) {
    container.innerHTML = '<div class="stat-card"><div class="num">0</div><div class="label">总答卷数</div></div>';
    return;
  }
  const total = allData.length;

  // Grade distribution
  const grade = countValues(2);
  let gradeStr = '';
  if (grade.counts) {
    gradeStr = Object.entries(grade.counts).map(([k,v]) => k + ':' + v).join(' ');
  }

  // Sleep under 7h
  const sleep = countValues(9);
  const sleepUnder7 = (sleep.counts['不足6小时'] || 0) + (sleep.counts['6-7小时'] || 0);

  // Willing to seek help
  const help = countValues(13);
  const willingCount = help.counts['愿意'] || 0;

  // Stress avg
  const stressAvg = calcAvgScale(7);

  // Overall mental health
  const overallAvg = calcAvgScale(30);

  let html = '';
  html += '<div class="stat-card"><div class="num">' + total + '</div><div class="label">总答卷数</div></div>';
  html += '<div class="stat-card"><div class="num" style="font-size:16px;">' + gradeStr + '</div><div class="label">年级分布</div></div>';
  html += '<div class="stat-card"><div class="num">' + pct(sleepUnder7, total) + '%</div><div class="label">睡眠不足7h</div></div>';
  html += '<div class="stat-card"><div class="num">' + pct(willingCount, total) + '%</div><div class="label">愿意心理咨询</div></div>';
  html += '<div class="stat-card"><div class="num">' + stressAvg + '</div><div class="label">平均学业压力(1-5)</div></div>';
  html += '<div class="stat-card"><div class="num">' + overallAvg + '</div><div class="label">整体心理评分(1-5)</div></div>';
  container.innerHTML = html;
}

function renderCharts() {
  const container = document.getElementById('chartsTab');
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];
  container.innerHTML = '';

  if (allData.length === 0) {
    container.innerHTML = '<div class="empty-state"><h2>暂无数据</h2><p>还没有人提交问卷</p></div>';
    return;
  }

  const chartDefs = [
    { title:'性别分布', qid:1, type:'pie' },
    { title:'年级分布', qid:2, type:'pie' },
    { title:'学校类型', qid:3, type:'pie' },
    { title:'学业压力分布', qid:7, type:'bar' },
    { title:'压力来源', qid:8, type:'bar' },
    { title:'睡眠时长分布', qid:9, type:'pie' },
    { title:'学校心理咨询室情况', qid:12, type:'pie' },
    { title:'心理咨询意愿', qid:13, type:'pie' },
    { title:'倾诉对象', qid:15, type:'bar' },
    { title:'家长期望程度', qid:19, type:'pie' },
    { title:'沟通频率', qid:21, type:'pie' },
    { title:'父母反应', qid:23, type:'pie' },
    { title:'近期情绪状态', qid:26, type:'bar' },
    { title:'心理困扰来源', qid:27, type:'bar' },
    { title:'缓解方式', qid:29, type:'bar' },
    { title:'人际关系评分', qid:25, type:'bar' },
    { title:'父母关注度评分', qid:20, type:'bar' },
    { title:'整体心理健康', qid:30, type:'bar' }
  ];

  const colors = ['#1a73e8','#e8710a','#43a047','#e53935','#8e24aa','#00acc1','#fdd835','#6d4c41','#fb8c00','#3949ab','#c0ca33','#00897b'];

  chartDefs.forEach(def => {
    const { counts, total } = countValues(def.qid);
    if (total === 0) return;
    const keys = Object.keys(counts);

    const card = document.createElement('div');
    card.className = 'chart-card';
    const avg = scaleQs.includes(def.qid) ? calcAvgScale(def.qid) : null;
    const title = def.title + (avg !== null ? ' (均分:' + avg + '/5)' : '') + ' <span style="font-weight:400;color:#999;font-size:12px;">(' + total + '人)</span>';
    card.innerHTML = '<h3>' + title + '</h3><canvas></canvas>';
    container.appendChild(card);

    const canvas = card.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    const values = keys.map(k => counts[k]);

    if (def.type === 'pie') {
      const c = new Chart(ctx, {
        type: 'pie',
        data: { labels: keys, datasets: [{ data: values, backgroundColor: colors }] },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } } }
      });
      chartInstances.push(c);
    } else {
      const c = new Chart(ctx, {
        type: 'bar',
        data: { labels: keys, datasets: [{ data: values, backgroundColor: colors.slice(0, keys.length), borderRadius: 4 }] },
        options: {
          responsive: true, indexAxis: 'y',
          plugins: { legend: { display: false } },
          scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } }
        }
      });
      chartInstances.push(c);
    }
  });
}

function renderTable() {
  const container = document.getElementById('tableBody');
  if (allData.length === 0) {
    container.innerHTML = '<div class="empty-state"><h2>暂无数据</h2></div>';
    return;
  }
  const qids = Object.keys(questions).map(Number);
  let html = '<table><thead><tr><th>#</th><th>提交时间</th>';
  qids.forEach(id => { html += '<th>' + id + '</th>'; });
  html += '</tr></thead><tbody>';

  allData.forEach((d, idx) => {
    const time = new Date(d.created_at).toLocaleString('zh-CN');
    html += '<tr><td>' + (idx+1) + '</td><td style="white-space:nowrap;">' + time + '</td>';
    qids.forEach(id => {
      const v = getVal(d, id);
      if (v === null) html += '<td></td>';
      else if (Array.isArray(v)) html += '<td title="' + v.join('; ') + '">' + v.join('; ') + '</td>';
      else html += '<td>' + v + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function renderIndividual() {
  const filterContainer = document.getElementById('indivFilter');
  let filterHtml = '<button class="active" data-mod="all" onclick="filterIndividual(\'all\',this)">全部</button>';
  modules.forEach(m => {
    filterHtml += '<button data-mod="' + m.name + '" onclick="filterIndividual(\'' + m.name + '\',this)">' + m.name + '</button>';
  });
  filterContainer.innerHTML = filterHtml;
  document.getElementById('individualBody').innerHTML = allData.length === 0
    ? '<div class="empty-state"><h2>暂无数据</h2></div>'
    : '';
  renderIndividualList('all');
}

let currentFilter = 'all';
function filterIndividual(mod, btn) {
  currentFilter = mod;
  document.querySelectorAll('#indivFilter button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderIndividualList(mod);
}

function renderIndividualList(mod) {
  const body = document.getElementById('individualBody');
  body.innerHTML = '';
  const showIds = mod === 'all'
    ? Object.keys(questions).map(Number)
    : (modules.find(m => m.name === mod)?.ids || []);

  allData.forEach((d, idx) => {
    const card = document.createElement('div');
    card.className = 'response-card';
    const time = new Date(d.created_at).toLocaleString('zh-CN');
    let html = '<div style="font-size:12px;color:#999;margin-bottom:8px;">#' + (idx+1) + ' · ' + time + '</div>';
    showIds.forEach(qid => {
      const v = getVal(d, qid);
      let display = v === null ? '<span style="color:#ccc;">未回答</span>' : (Array.isArray(v) ? v.join('; ') : v);
      html += '<div class="q-row"><span class="q-number">' + qid + '.</span><span class="q-label">' + questions[qid] + '</span><span class="q-answer">' + display + '</span></div>';
    });
    card.innerHTML = html;
    body.appendChild(card);
  });
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#chartsTab, #tableTab, #individualTab').forEach(el => el.classList.remove('active'));
  document.getElementById(tab + 'Tab').classList.add('active');
}

function exportAllCSV() {
  if (allData.length === 0) { alert('暂无数据可导出'); return; }
  const qids = Object.keys(questions).map(Number);
  const BOM = '﻿';
  let csv = BOM + '编号,提交时间';
  qids.forEach(id => { csv += ',' + id + '.' + questions[id]; });
  csv += '\n';

  allData.forEach((d, idx) => {
    const time = new Date(d.created_at).toLocaleString('zh-CN');
    csv += (idx+1) + ',"' + time + '"';
    qids.forEach(id => {
      const v = getVal(d, id);
      let display = '';
      if (v === null) display = '';
      else if (Array.isArray(v)) display = v.join('; ');
      else display = String(v);
      csv += ',"' + display.replace(/"/g,'""') + '"';
    });
    csv += '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '心理健康问卷_全部数据_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
